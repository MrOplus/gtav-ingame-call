; PhoneLink configuration - lives next to PhoneLink.asi in the GTA V folder.

[Server]
; Keep 127.0.0.1 unless you really need LAN access; then set a Token.
Host=127.0.0.1
HttpPort=8765
WsPort=8766
; If set, clients must send "Authorization: Bearer <token>" (or ?token=<token>).
Token=

[Call]
RingTimeoutSec=25
; Ped ringtone sound name, e.g. Remote_Ring or Dial_and_Remote_Ring
Ringtone=Remote_Ring
; Contact picture used when a request doesn't specify "icon" (e.g. CHAR_LESTER, CHAR_MICHAEL)
DefaultIcon=CHAR_DEFAULT
; Put the phone to the player's ear during calls (1/0) and the TASK_USE_MOBILE_PHONE mode
PhoneAnimation=1
PhoneAnimMode=0
; Virtual-key codes: 0x59 = Y, 0x4E = N
AnswerKey=0x59
HangupKey=0x4E
; Opens the contacts menu to call a friend who has your call page open (0x76 = F7)
ContactsKey=0x76
; 1 = friends also appear in the game phone's Contacts app (Up arrow) and outgoing calls use
; the phone's own call screen. Set 0 if it conflicts with a mission or another phone mod.
NativePhone=1

[Audio]
; Master volume of call audio (0.0 - 1.0+)
Volume=1.0
; SAPI voice name for text-to-speech calls, e.g. Microsoft Zira Desktop (empty = default)
TtsVoice=
; -10 (slow) .. 10 (fast)
TtsRate=0
; Default microphone sample rate for two-way streaming calls
MicSampleRate=16000

[Log]
; debug | info | warn | error. PhoneLink.log is recreated each launch; the previous one is kept as PhoneLink.prev.log
Level=info
