name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset release

      - name: Build plugin and test harness
        run: cmake --build --preset release

      - name: Smoke test (plugin loads, API answers, exits cleanly)
        shell: pwsh
        run: |
          python -m pip install --quiet websockets
          python tests/harness/exit_test.py build/harness

      - name: Package
        id: package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink.asi
          path: |
            build/PhoneLink.asi
            PhoneLink.ini

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            build/PhoneLink.asi
          generate_release_notes: true
