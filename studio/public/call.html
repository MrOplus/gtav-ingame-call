<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PhoneLink Call</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234cc38a' stroke-width='2'%3E%3Crect x='6' y='2' width='12' height='20' rx='2.5'/%3E%3C/svg%3E">
<style>
  :root { --bg: #0b0d10; --panel: #15181d; --line: #2a2f38; --text: #eef0f3; --muted: #8b93a1;
          --green: #34c77b; --red: #e5484d; --amber: #e5b45d; --blue: #5db6e5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #1a2330 0%, var(--bg) 60%); color: var(--text);
         font: 16px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .phone { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 28px;
           padding: 36px 24px 28px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .avatar { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: 700; background: linear-gradient(135deg, #2f8fc4, #1d4f6e); color: #fff; position: relative; }
  .avatar.pulse::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--green); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .status { margin: 6px 0 24px; color: var(--muted); min-height: 24px; display: flex; gap: 8px; align-items: center; justify-content: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--green); } .dot.busy { background: var(--amber); } .dot.off { background: var(--red); }
  .timer { font-variant-numeric: tabular-nums; }
  label { display: block; text-align: left; color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  input { width: 100%; background: #0f1216; border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 12px 14px; font: inherit; margin-bottom: 14px; }
  input:focus { outline: 2px solid var(--blue); border-color: transparent; }
  .controls { display: flex; gap: 22px; justify-content: center; margin-top: 8px; }
  .round { width: 68px; height: 68px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; }
  .round:disabled { opacity: .35; cursor: default; }
  .call { background: var(--green); } .end { background: var(--red); } .mute { background: #2a2f38; } .mute.on { background: #fff; color: #111; }
  .round svg { width: 28px; height: 28px; }
  .caption { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .note { margin-top: 22px; font-size: 13px; color: var(--muted); }
  .error { color: #f3b1ad; }
  .sms { display: flex; gap: 8px; margin-top: 22px; align-items: flex-end; }
  .sms textarea { flex: 1; background: #0f1216; border: 1px solid var(--line); color: var(--text); border-radius: 12px;
                  padding: 10px 12px; font: inherit; resize: none; min-height: 44px; }
  .sms textarea:focus { outline: 2px solid var(--blue); border-color: transparent; }
  .sms button { background: var(--blue); color: #06121a; border: 0; border-radius: 12px; padding: 0 16px; height: 44px; font: inherit; font-weight: 600; cursor: pointer; }
  .sms button:disabled { opacity: .45; }
  .smsStatus { font-size: 12.5px; color: var(--muted); min-height: 18px; margin-top: 6px; text-align: left; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="phone">
  <div class="avatar" id="avatar">?</div>
  <h1 id="host">PhoneLink</h1>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>

  <form id="join" hidden>
    <label for="name">Your name (shown on their phone)</label>
    <input id="name" maxlength="24" autocomplete="nickname" required>
    <label for="code" id="codeLabel">Invite code</label>
    <input id="code" autocomplete="off" required>
  </form>

  <div class="controls">
    <div id="muteWrap" hidden>
      <button class="round mute" id="muteBtn" aria-label="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <div class="caption" id="muteCaption">Mute</div>
    </div>
    <div id="callWrap">
      <button class="round call" id="callBtn" aria-label="Call" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      </button>
      <div class="caption">Call</div>
    </div>
    <div id="declineWrap" hidden>
      <button class="round end" id="declineBtn" aria-label="Decline"><svg viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
      <div class="caption">Decline</div>
    </div>
    <div id="acceptWrap" hidden>
      <button class="round call" id="acceptBtn" aria-label="Accept"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
      <div class="caption">Accept</div>
    </div>
    <div id="endWrap" hidden>
      <button class="round end" id="endBtn" aria-label="Hang up">
        <svg viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      </button>
      <div class="caption">End</div>
    </div>
  </div>
  <form class="sms" id="smsForm" hidden>
    <textarea id="smsText" maxlength="300" rows="1" placeholder="Text their in-game phone" aria-label="Message"></textarea>
    <button id="smsBtn" type="submit">Send</button>
  </form>
  <div class="smsStatus" id="smsStatus"></div>
  <p class="note" id="note">They answer from inside GTA V. Keep this page open to get calls from them.</p>
  <audio id="remote" autoplay playsinline></audio>
</main>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let ws, pc, local, iceServers = [], state = "idle", timerId, statusPoll, ring, pendingCall = false;
let hostName = "", titleBlink, actx;

$("code").value = params.get("code") || store.get("phonelink.code") || "";
$("name").value = store.get("phonelink.name") || "";
if (params.get("code")) { $("code").hidden = true; $("codeLabel").hidden = true; }

const REASONS = {
  declined: "Call declined", no_answer: "No answer", busy: "Busy — they're on another call",
  offline: "Not in game right now", hung_up: "Call ended", host_hung_up: "They hung up",
  host_unavailable: "They became unavailable", connection_failed: "Connection failed — try again",
  caller_left: "Call ended", failed: "Call failed", ended: "Call ended", cancelled: "They hung up",
};

function setStatus(text, dotClass = "") {
  $("statusText").textContent = text;
  $("dot").className = "dot " + dotClass;
}
function showAvailability(s) {
  if (state !== "idle" && state !== "setup") return;
  const map = { available: ["In game — available", "ok"], busy: ["On another call", "busy"], offline: ["Not in game", "off"] };
  const [t, c] = map[s] || ["Unknown", ""];
  setStatus(t, c);
  $("callBtn").disabled = s !== "available";
}
// Modes: setup | idle | calling (you call them) | incoming (they call you) | connected | denied
function setUi(mode) {
  state = mode;
  const inCall = mode === "calling" || mode === "connected";
  $("callWrap").hidden = inCall || mode === "incoming";
  $("endWrap").hidden = !inCall;
  $("acceptWrap").hidden = $("declineWrap").hidden = mode !== "incoming";
  $("muteWrap").hidden = mode !== "connected";
  $("join").hidden = inCall || mode === "incoming" || ($("name").value && $("code").value && mode !== "setup");
  $("smsForm").hidden = !(mode === "idle" || mode === "connected");
  $("avatar").classList.toggle("pulse", mode === "calling" || mode === "incoming");
}

// ---- tones (WebAudio). Browsers only allow sound after the page has been tapped once,
// so the context is created/resumed on the first interaction.
function audioCtx() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
["pointerdown", "keydown"].forEach((e) => addEventListener(e, audioCtx, { once: true }));

function startTone(freqs, onSec, periodSec, volume) {
  stopTone();
  const ctx = audioCtx();
  if (!ctx) return;
  const gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination);
  const oscs = freqs.map((f) => { const o = ctx.createOscillator(); o.frequency.value = f; o.connect(gain); o.start(); return o; });
  const cycle = () => { gain.gain.setValueAtTime(volume, ctx.currentTime); gain.gain.setValueAtTime(0, ctx.currentTime + onSec); };
  cycle();
  const id = setInterval(cycle, periodSec * 1000);
  ring = () => { clearInterval(id); oscs.forEach((o) => o.stop()); gain.disconnect(); ring = null; };
}
function stopTone() { if (ring) ring(); }
const startRingback = () => startTone([440, 480], 2, 6, 0.06);  // you're calling them
const startRingtone = () => startTone([660, 880], 1, 2.5, 0.12); // they're calling you
const stopRingback = stopTone;

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/signal`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", code: $("code").value.trim(), name: $("name").value.trim() }));
  ws.onmessage = (m) => onSignal(JSON.parse(m.data));
  ws.onclose = () => {
    clearInterval(statusPoll);
    if (state === "calling" || state === "connected") endCall("Connection lost");
    if (state !== "denied") { setStatus("Reconnecting…"); setTimeout(connect, 3000); }
  };
}

async function onSignal(msg) {
  switch (msg.type) {
    case "welcome":
      iceServers = msg.iceServers || [];
      hostName = msg.host;
      $("host").textContent = msg.host;
      $("avatar").textContent = (msg.host || "?").trim().charAt(0).toUpperCase();
      document.title = `Call ${msg.host}`;
      store.set("phonelink.code", $("code").value.trim());
      store.set("phonelink.name", $("name").value.trim());
      showAvailability(msg.status);
      if (pendingCall) { pendingCall = false; if (msg.status === "available") startCall(); }
      clearInterval(statusPoll);
      statusPoll = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ type: "status" })), 5000);
      break;
    case "denied":
      state = "denied";
      setStatus(msg.reason === "rate_limited" ? "Too many attempts — wait a few minutes" : "Invalid invite link or code", "off");
      $("join").hidden = false; $("code").hidden = false; $("codeLabel").hidden = false;
      $("callBtn").disabled = false;
      break;
    case "status": showAvailability(msg.status); break;
    case "answer": await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp }); break;
    case "ringing": setStatus("Ringing…", "ok"); break;
    case "connected": {
      stopRingback(); setUi("connected");
      const t0 = Date.now();
      const tick = () => { const s = Math.floor((Date.now() - t0) / 1000); setStatus(`${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`, "ok"); };
      tick(); timerId = setInterval(tick, 1000);
      break;
    }
    case "incoming":
      if (state === "calling" || state === "connected") break;
      setUi("incoming");
      setStatus(`${msg.from || hostName} is calling you…`, "ok");
      startRingtone();
      if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
      clearInterval(titleBlink);
      titleBlink = setInterval(() => { document.title = document.title.startsWith("📞") ? `Call ${hostName}` : `📞 ${hostName} is calling`; }, 900);
      break;
    case "ended": {
      const missed = state === "incoming" && (msg.reason === "no_answer" || msg.reason === "cancelled");
      endCall(missed ? `Missed call from ${hostName}` : REASONS[msg.reason] || "Call ended");
      break;
    }
    case "sms_result":
      $("smsStatus").textContent = msg.ok ? "Delivered to their in-game phone" :
        msg.reason === "offline" ? "Not delivered — they're not in game" : "Slow down a little";
      $("smsBtn").disabled = false;
      if (msg.ok) $("smsText").value = "";
      break;
  }
}

// kind "call": you call them; kind "accept": you answer their call.
async function startCall(kind = "call") {
  if (!$("name").value.trim()) { setUi("setup"); $("name").focus(); return; }
  if (state === "denied") { state = "idle"; ws.close(); return; }
  stopTone();
  stopBlink();
  setUi("calling");
  setStatus("Getting microphone…");
  try {
    local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch {
    if (kind === "accept") ws.send(JSON.stringify({ type: "decline" }));
    setUi("idle"); setStatus("Microphone permission is needed to call", "off"); return;
  }
  pc = new RTCPeerConnection({ iceServers });
  local.getTracks().forEach((t) => pc.addTrack(t, local));
  pc.ontrack = (e) => { $("remote").srcObject = e.streams[0] || new MediaStream([e.track]); };
  pc.onconnectionstatechange = () => { if (pc && pc.connectionState === "failed") endCall(REASONS.connection_failed); };
  await pc.setLocalDescription(await pc.createOffer());
  // Wait for ICE gathering so the offer carries all candidates (no trickle needed).
  await new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") return resolve();
    const t = setTimeout(resolve, 2500);
    pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); resolve(); } };
  });
  if (kind === "accept") {
    setStatus("Connecting…", "ok");
  } else {
    setStatus("Calling…", "ok");
    startRingback();
  }
  ws.send(JSON.stringify({ type: kind, sdp: pc.localDescription.sdp, name: $("name").value.trim() }));
}
function stopBlink() { clearInterval(titleBlink); if (hostName) document.title = `Call ${hostName}`; }

function endCall(text) {
  stopRingback();
  stopBlink();
  clearInterval(timerId);
  if (pc) { pc.close(); pc = null; }
  if (local) { local.getTracks().forEach((t) => t.stop()); local = null; }
  $("remote").srcObject = null;
  $("muteBtn").classList.remove("on"); $("muteCaption").textContent = "Mute";
  setUi("idle");
  setStatus(text, "");
  setTimeout(() => ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: "status" })), 2500);
}

$("callBtn").onclick = () => {
  if (!$("join").hidden && (!$("name").value.trim() || !$("code").value.trim())) { $("name").focus(); return; }
  if (!ws || ws.readyState !== 1 || state === "denied") {
    pendingCall = true; // place the call as soon as the code is accepted
    state = "idle";
    if (ws) ws.close(); else connect();
    return;
  }
  store.set("phonelink.name", $("name").value.trim());
  startCall();
};
$("acceptBtn").onclick = () => startCall("accept");
$("declineBtn").onclick = () => { ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: "decline" })); endCall("Call declined"); };
$("name").addEventListener("change", () => {
  const name = $("name").value.trim();
  store.set("phonelink.name", name);
  if (name && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "profile", name }));
});
$("smsForm").onsubmit = (e) => {
  e.preventDefault();
  const text = $("smsText").value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  $("smsBtn").disabled = true;
  $("smsStatus").textContent = "Sending…";
  ws.send(JSON.stringify({ type: "sms", text, name: $("name").value.trim() }));
};
$("smsText").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("smsForm").requestSubmit(); } });
$("endBtn").onclick = () => { ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: "hangup" })); endCall("Call ended"); };
$("muteBtn").onclick = () => {
  if (!local) return;
  const on = !$("muteBtn").classList.contains("on");
  local.getAudioTracks().forEach((t) => (t.enabled = !on));
  $("muteBtn").classList.toggle("on", on);
  $("muteCaption").textContent = on ? "Unmute" : "Mute";
};

setUi(!$("name").value || !$("code").value ? "setup" : "idle");
if ($("code").value) connect(); else setStatus("Enter your name and invite code");
$("join").onsubmit = (e) => { e.preventDefault(); $("callBtn").click(); };
</script>
</body>
</html>
